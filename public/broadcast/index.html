<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Live report · Engage</title>
<style>
*{box-sizing:border-box}body{font:15px/1.5 system-ui,sans-serif;background:#f5f7f6;color:#203d3e;margin:0}main{max-width:1100px;margin:30px auto;padding:20px}header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:6px 0}p{color:#627771}section{background:#fff;border:1px solid #dce5e2;border-radius:14px;padding:20px;margin:18px 0}button,input{font:inherit;padding:11px 15px;border:1px solid #ccd9d5;border-radius:9px;background:#fff;color:#203d3e}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:block;margin-bottom:10px}input{max-width:100%;display:block;margin-top:6px}.primary{background:#145456;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{border-bottom:1px solid #e1e8e5;padding:12px;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#status{color:#913a30}small{color:#627771}[hidden]{display:none!important}@media(max-width:600px){main{margin:0;padding:14px}section{padding:14px}input{font-size:16px}}
</style></head><body><main><header><div><small>ENGAGE · SHARED REPORT</small><h1 id="title">Live report</h1><small>Read-only access · Refreshes every 60 seconds</small></div><button id="refresh">Refresh</button></header><p id="status" role="status" aria-live="polite">Loading…</p><section id="unlock" hidden><form id="pin-form"><label>Report PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label><button class="primary">Open report</button></form></section><section id="report" hidden><p id="range"></p><small id="updated"></small><div class="table-wrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>No matching records.</p><div class="actions"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></div></section></main>
<script>
(()=>{'use strict';const API='https://engage-backend-65xk.onrender.com';const token=location.hash.slice(1);const el=id=>document.getElementById(id);let pin='',offset=0,busy=false,loaded=false;
async function load(nextOffset=offset){if(busy)return;busy=true;el('refresh').disabled=true;el('previous').disabled=true;el('next').disabled=true;try{if(!token)throw new Error('This report link is invalid.');const response=await fetch(API+'/public/broadcast/read',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({token,pin,offset:nextOffset})});const r=await response.json();if(!response.ok){if(response.status===401)el('unlock').hidden=false;throw new Error(r.error||'Could not load report.');}offset=nextOffset;loaded=true;el('unlock').hidden=true;el('report').hidden=false;el('status').textContent='';el('title').textContent=r.title;el('range').textContent=(r.from?r.from+' to '+r.to:'All time')+' · '+r.dateBasis+' · India time';el('updated').textContent='Last updated '+new Date(r.updatedAt).toLocaleString();el('columns').replaceChildren();const head=document.createElement('tr');r.columns.forEach(c=>{const th=document.createElement('th');th.textContent=c.label;head.append(th);});el('columns').append(head);el('rows').replaceChildren();r.rows.forEach(row=>{const tr=document.createElement('tr');r.columns.forEach(c=>{const td=document.createElement('td');td.textContent=row[c.key]==null?'—':['total','paid','remaining','value'].includes(c.key)?new Intl.NumberFormat('en-IN',{style:'currency',currency:r.currency}).format(Number(row[c.key])):String(row[c.key]);tr.append(td);});el('rows').append(tr);});el('empty').hidden=!!r.rows.length;el('page').textContent='Page '+(offset/50+1);el('previous').disabled=offset===0;el('next').disabled=!r.hasMore;}catch(e){loaded=false;el('report').hidden=true;el('rows').replaceChildren();el('status').textContent=e.message;}finally{busy=false;el('refresh').disabled=false;}}
el('pin-form').onsubmit=e=>{e.preventDefault();pin=el('pin').value;load(0);};el('refresh').onclick=()=>load();el('previous').onclick=()=>load(Math.max(0,offset-50));el('next').onclick=()=>load(offset+50);setInterval(()=>{if(!document.hidden&&loaded)load();},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&loaded)load();});load();})();
</script></body></html>
