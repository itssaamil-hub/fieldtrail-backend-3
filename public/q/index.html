<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Secure quotation</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173b3b;background:#f5f7f6;line-height:1.45}*{box-sizing:border-box}body{margin:0}.shell{max-width:900px;margin:0 auto;padding:28px 18px 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:46px;height:46px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #dce7e3;padding:4px}.brand h1{font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.secure{font-size:12px;color:#617675;display:flex;align-items:center;gap:6px;white-space:nowrap}.card{background:#fff;border:1px solid #dde8e4;border-radius:18px;box-shadow:0 10px 30px rgba(25,70,65,.06);padding:22px;margin-bottom:16px}.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#47706d;text-transform:uppercase}.hero h2{font-size:28px;line-height:1.15;margin:6px 0 8px}.muted{color:#657a78}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;background:#eaf7ef;color:#19733b}.pill.warn{background:#fff4df;color:#8a5a00}.pill.neutral{background:#eef2f1;color:#526765}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}.fact{background:#f7faf9;border:1px solid #e1e9e7;border-radius:12px;padding:12px}.fact span{display:block;font-size:12px;color:#6b7e7c}.fact strong{display:block;margin-top:3px}.amount{text-align:right}.amount span{font-size:12px;color:#6b7e7c}.amount strong{display:block;font-size:28px;color:#145456;margin-top:4px}.section-title{font-size:16px;margin:0 0 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #e6ecea;font-size:14px}.table th{font-size:12px;color:#6b7e7c}.table th:nth-child(n+2),.table td:nth-child(n+2){text-align:right}.features{font-size:12px;color:#6b7e7c;margin-top:4px;white-space:pre-line}.totals{margin-left:auto;max-width:360px;padding-top:10px}.row{display:flex;justify-content:space-between;gap:16px;padding:6px 0}.row.total{border-top:1px solid #dbe5e2;margin-top:6px;padding-top:12px;font-size:18px}.details{border-top:1px solid #e4ebe9;padding:14px 0}.details:first-of-type{border-top:0}.details summary{cursor:pointer;font-weight:700}.details p{white-space:pre-line;color:#526765}.actions{display:flex;gap:10px;position:sticky;bottom:10px;background:rgba(245,247,246,.94);backdrop-filter:blur(8px);padding:10px;border-radius:16px;border:1px solid #dfe8e5}.btn{appearance:none;border:1px solid #cbdad6;border-radius:11px;padding:12px 16px;font-weight:800;font-size:14px;background:#fff;color:#174846;cursor:pointer;flex:1}.btn.primary{background:#0f9d50;border-color:#0f9d50;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.panel{display:none}.panel.show{display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #cfdcd8;border-radius:10px;padding:11px 12px;font:inherit;color:#173b3b;background:#fff}.field textarea{min-height:110px;resize:vertical}.field.full{grid-column:1/-1}.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#435e5b;margin:14px 0}.notice{border-radius:12px;padding:12px 14px;margin-bottom:14px;background:#eef7f3;color:#245b46}.error{background:#fff0ef;color:#9b2f29}.success{text-align:center;padding:42px 22px}.tick{width:64px;height:64px;border-radius:50%;background:#10a755;color:white;display:grid;place-items:center;font-size:36px;margin:0 auto 18px}.success h2{margin:0 0 8px}.loading{text-align:center;padding:80px 20px;color:#667c79}.hidden{display:none!important}@media(max-width:680px){.shell{padding:18px 12px 38px}.hero{grid-template-columns:1fr}.amount{text-align:left}.facts{grid-template-columns:1fr 1fr}.facts .fact:last-child{grid-column:1/-1}.card{padding:17px;border-radius:15px}.hero h2{font-size:23px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table th:nth-child(3),.table td:nth-child(3){display:none}.actions{flex-direction:column}.secure span{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <div id="loading" class="loading">Loading secure quotation…</div>
    <div id="app" class="hidden"></div>
  </main>
<script>
(() => {
  'use strict';
  const API='https://engage-backend-65xk.onrender.com';
  const token=new URLSearchParams(location.search).get('t')||'';
  const app=document.getElementById('app'),loading=document.getElementById('loading');
  let quote=null,mode='accepted';
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const money=(minor,currency)=>new Intl.NumberFormat('en-IN',{style:'currency',currency:currency||'INR',maximumFractionDigits:2}).format(Number(minor||0)/100);
  const period=p=>({monthly:'Monthly',yearly:'Yearly',one_time:'One-time'}[p]||p||'');
  const statusLabel=q=>q.response?.action==='accepted'?'Accepted by customer':q.response?.action==='changes_requested'?'Changes requested':q.superseded?'Superseded':q.expired?'Expired':q.revoked?'Link revoked':q.quotationStatus==='accepted'?'Accepted':'Open for response';
  const statusClass=q=>(q.response?.action==='accepted'||q.quotationStatus==='accepted')?'pill':(q.expired||q.superseded||q.revoked||q.response?.action==='changes_requested')?'pill warn':'pill';
  const itemRow=(m)=>`<tr><td><strong>${esc(m.name)}</strong>${m.features?`<div class="features">${esc(m.features)}</div>`:''}<div class="muted">${esc(period(m.period))}</div></td><td>${esc(m.quantity||1)}</td><td>${money(Math.round(Number(m.price||0)*100),quote.currency)}</td><td><strong>${money(Math.round(Number(m.price||0)*100)*(Number(m.quantity)||1),quote.currency)}</strong></td></tr>`;
  function render(){
    const q=quote,items=[q.package,...(q.addons||[])].filter(Boolean),advance=Math.round(Number(q.totalMinor||0)*Number(q.advancePercent||0)/100);
    const safeLogo=/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(q.logo||'')?q.logo:'';
    app.innerHTML=`
      <div class="top"><div class="brand">${safeLogo?`<img class="logo" src="${safeLogo}" alt="">`:''}<div><h1>${esc(q.businessName)}</h1><div class="muted">Quotation ${esc(q.quoteNumber)} · Revision ${esc(q.revision)}</div></div></div><div class="secure">🔒 <span>Secure quotation</span></div></div>
      <section class="card hero"><div><div class="eyebrow">Prepared for</div><h2>${esc(q.customer.name)}</h2><div class="muted">${esc([q.customer.contact,q.customer.phone].filter(Boolean).join(' · '))}</div><div class="facts"><div class="fact"><span>Issued</span><strong>${esc(q.issuedOn)}</strong></div><div class="fact"><span>Valid until</span><strong>${esc(q.expiresOn)}</strong></div><div class="fact"><span>Status</span><strong class="${statusClass(q)}">${esc(statusLabel(q))}</strong></div></div></div><div class="amount"><span>Total quotation value</span><strong>${money(q.totalMinor,q.currency)}</strong></div></section>
      ${q.response?`<div class="notice">${q.response.action==='accepted'?`Accepted by ${esc(q.response.customerName)}${q.response.designation?` · ${esc(q.response.designation)}`:''}.`:`Changes requested by ${esc(q.response.customerName)}.`}</div>`:''}
      ${q.superseded?'<div class="notice error">A newer quotation revision is available. Please ask for the latest link before responding.</div>':''}
      ${q.expired?'<div class="notice error">This quotation has expired. Please contact the sender for a new quotation.</div>':''}
      <section class="card"><h3 class="section-title">Modules & pricing</h3><table class="table"><thead><tr><th>Module / add-on</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${items.map(itemRow).join('')}</tbody></table><div class="totals">${Number(q.discountMinor)>0?`<div class="row"><span>Discount (${esc(q.discount)}%)</span><span>−${money(q.discountMinor,q.currency)}</span></div>`:''}${Number(q.taxMinor)>0?`<div class="row"><span>Tax (${esc(q.taxPercent)}%)</span><span>${money(q.taxMinor,q.currency)}</span></div>`:''}<div class="row total"><strong>Total</strong><strong>${money(q.totalMinor,q.currency)}</strong></div><div class="row"><span>Advance required (${esc(q.advancePercent)}%)</span><strong>${money(advance,q.currency)}</strong></div><div class="row"><span>Remaining after advance</span><strong>${money(Number(q.totalMinor)-advance,q.currency)}</strong></div></div></section>
      <section class="card">${q.terms?`<details class="details" open><summary>Payment & renewal terms</summary><p>${esc(q.terms)}</p></details>`:''}${q.supportContact?`<details class="details"><summary>Support & contact</summary><p>${esc(q.supportContact)}</p></details>`:''}${q.footer?`<div class="details"><p>${esc(q.footer)}</p></div>`:''}</section>
      <section id="responsePanel" class="card panel"><h3 id="responseTitle" class="section-title">Accept quotation</h3><p id="responseIntro" class="muted">Please confirm your details and acceptance.</p><div id="formError" class="notice error hidden"></div><form id="responseForm"><div class="form-grid"><label class="field">Your name *<input id="customerName" maxlength="180" required value="${esc(q.customer.contact||'')}"></label><label class="field">Designation (optional)<input id="designation" maxlength="120" placeholder="Owner, Manager…"></label><label class="field">Email (optional)<input id="email" type="email" maxlength="254"></label><label class="field">Phone (optional)<input id="phone" maxlength="30" value="${esc(q.customer.phone||'')}"></label><label id="messageField" class="field full hidden">What would you like changed? *<textarea id="message" maxlength="1500"></textarea></label></div><label id="acceptCheck" class="check"><input id="acceptedTerms" type="checkbox"> <span>I accept this quotation and its payment and renewal terms.</span></label><div class="actions" style="position:static;background:transparent;border:0;padding:0;margin-top:12px"><button type="button" class="btn" id="cancelResponse">Cancel</button><button type="submit" class="btn primary" id="submitResponse">Accept quotation</button></div></form></section>
      ${q.canRespond?`<div id="mainActions" class="actions"><button class="btn primary" id="acceptBtn">✓ Accept quotation</button><button class="btn" id="changesBtn">Request changes</button></div>`:''}`;
    bind();
  }
  function bind(){
    const accept=document.getElementById('acceptBtn'),changes=document.getElementById('changesBtn');
    if(accept)accept.onclick=()=>openForm('accepted');
    if(changes)changes.onclick=()=>openForm('changes_requested');
    const cancel=document.getElementById('cancelResponse');if(cancel)cancel.onclick=closeForm;
    const form=document.getElementById('responseForm');if(form)form.onsubmit=submit;
  }
  function openForm(next){
    mode=next;document.getElementById('responsePanel').classList.add('show');document.getElementById('mainActions')?.classList.add('hidden');
    const change=mode==='changes_requested';document.getElementById('responseTitle').textContent=change?'Request changes':'Accept quotation';document.getElementById('responseIntro').textContent=change?'Tell us what needs to change. The sender will receive your request.':'Please confirm your details and acceptance.';document.getElementById('messageField').classList.toggle('hidden',!change);document.getElementById('acceptCheck').classList.toggle('hidden',change);document.getElementById('message').required=change;document.getElementById('submitResponse').textContent=change?'Send change request':'Accept quotation';document.getElementById('responsePanel').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function closeForm(){document.getElementById('responsePanel').classList.remove('show');document.getElementById('mainActions')?.classList.remove('hidden')}
  async function submit(e){
    e.preventDefault();const err=document.getElementById('formError');err.classList.add('hidden');
    if(mode==='accepted'&&!document.getElementById('acceptedTerms').checked){err.textContent='Please confirm that you accept the quotation and its terms.';err.classList.remove('hidden');return}
    const button=document.getElementById('submitResponse');button.disabled=true;button.textContent='Submitting…';
    const body={action:mode,customerName:document.getElementById('customerName').value.trim(),designation:document.getElementById('designation').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),message:document.getElementById('message').value.trim()};
    try{const r=await fetch(`${API}/public/quotation/${encodeURIComponent(token)}/respond`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Could not submit your response.');showSuccess(data)}catch(ex){err.textContent=ex.message;err.classList.remove('hidden');button.disabled=false;button.textContent=mode==='accepted'?'Accept quotation':'Send change request'}
  }
  function showSuccess(data){app.innerHTML=`<div class="top"><div class="brand"><div><h1>${esc(quote.businessName)}</h1><div class="muted">${esc(quote.quoteNumber)} · Revision ${esc(quote.revision)}</div></div></div><div class="secure">🔒 <span>Secure quotation</span></div></div><section class="card success"><div class="tick">✓</div><h2>${data.action==='accepted'?'Quotation accepted successfully':'Change request sent'}</h2><p class="muted">${data.action==='accepted'?`Thank you, ${esc(data.customerName)}. Your acceptance has been recorded securely.`:'The quotation sender has received your requested changes.'}</p><div class="fact" style="max-width:420px;margin:22px auto 0;text-align:left"><span>Quotation</span><strong>${esc(quote.quoteNumber)} · Revision ${esc(quote.revision)}</strong><span style="margin-top:10px">Customer</span><strong>${esc(quote.customer.name)}</strong><span style="margin-top:10px">Total</span><strong>${money(quote.totalMinor,quote.currency)}</strong></div></section>`}
  async function load(){
    if(!token){loading.textContent='This quotation link is invalid.';return}
    try{const r=await fetch(`${API}/public/quotation/${encodeURIComponent(token)}`,{headers:{'Accept':'application/json'}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Could not load this quotation.');quote=data;loading.classList.add('hidden');app.classList.remove('hidden');render()}catch(ex){loading.innerHTML=`<div class="notice error">${esc(ex.message)}</div>`}
  }
  load();
})();
</script>
</body>
</html>
