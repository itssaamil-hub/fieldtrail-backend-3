<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1D23" />
    <meta name="description" content="Engage — employee lead capture and live location tracking, with GPS verification built in." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Engage" />
    <title>Engage — Lead & Location Ledger</title>
    <style>
      /* Keep key desktop workspaces on the same 1500px / 28px page rhythm as
         Exception Centre and Activity Centre without changing mobile spacing
         or any card/component internals. */
      @media (min-width: 1024px) {
        div:has(> .engage-dashboard-greeting),
        div[style*="max-width: 1180px"]:has(> .engage-reports-page),
        div[style*="max-width: 1180px"]:has(> div:not([hidden]) > .ft-tasks-embedded) {
          max-width: 1500px !important;
          padding-left: 28px !important;
          padding-right: 28px !important;
        }
      }

      /* Salesman phone More: only Quotations, Onboarding checklist and Payment due
         open edge-to-edge. Daily Reports and Settings keep their current UI. */
      @media (max-width: 600px) {
        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-q.ft-q-workspace),
        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-col.ft-q),
        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-ob-muted) {
          padding: 0 !important;
          align-items: stretch !important;
          background: #fff !important;
        }

        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-q.ft-q-workspace) > .ft-onboarding,
        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-col.ft-q) > .ft-onboarding,
        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-ob-muted) > .ft-onboarding {
          width: 100% !important;
          max-width: none !important;
          height: 100dvh !important;
          max-height: 100dvh !important;
          border-radius: 0 !important;
          padding: 16px 16px calc(24px + env(safe-area-inset-bottom)) !important;
        }

        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-q.ft-q-workspace) > .ft-onboarding > header,
        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-col.ft-q) > .ft-onboarding > header,
        body:has(.engage-salesman-more) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-ob-muted) > .ft-onboarding > header {
          top: -16px !important;
          margin-top: -16px !important;
          padding-top: calc(16px + env(safe-area-inset-top)) !important;
        }

        /* Admin phone More: the utility workspaces use the same edge-to-edge
           presentation as the salesman More workspaces, without changing desktop. */
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding.ft-q-page),
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding.ft-onboarding-desktop-full),
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-col.ft-q) {
          padding: 0 !important;
          align-items: stretch !important;
          background: #fff !important;
        }

        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding.ft-q-page) > .ft-onboarding,
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding.ft-onboarding-desktop-full) > .ft-onboarding,
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-col.ft-q) > .ft-onboarding {
          width: 100% !important;
          max-width: none !important;
          height: 100dvh !important;
          max-height: 100dvh !important;
          border-radius: 0 !important;
          padding: 16px 16px calc(24px + env(safe-area-inset-bottom)) !important;
        }

        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding.ft-q-page) > .ft-onboarding > header,
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding.ft-onboarding-desktop-full) > .ft-onboarding > header,
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) .ft-onboarding-backdrop:has(> .ft-onboarding > .ft-col.ft-q) > .ft-onboarding > header {
          top: -16px !important;
          margin-top: -16px !important;
          padding-top: calc(16px + env(safe-area-inset-top)) !important;
        }

        /* My Account is a dedicated admin-only More destination. */
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) [role="dialog"][aria-label="My Account"] {
          padding: 0 !important;
          place-items: stretch !important;
          background: #fff !important;
        }

        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) [role="dialog"][aria-label="My Account"] > div {
          width: 100% !important;
          max-width: none !important;
          height: 100dvh !important;
          max-height: 100dvh !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }

        /* Settings and Add expense use the app's bottom-sheet shell. Target only
           their distinctive phone structures so lead/attendance dialogs stay untouched. */
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) div[style*="z-index: 2000"]:has(> div > form input[type="number"][step="0.01"]):has(> div > form input[type="date"]),
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) div[style*="z-index: 2000"]:not(:has(form)):has(> div > div + button[style*="margin-bottom: 12px"]) {
          align-items: stretch !important;
          background: #fff !important;
        }

        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) div[style*="z-index: 2000"]:has(> div > form input[type="number"][step="0.01"]):has(> div > form input[type="date"]) > div,
        body:has(.engage-admin-bottom-nav[aria-label="Admin navigation"]) div[style*="z-index: 2000"]:not(:has(form)):has(> div > div + button[style*="margin-bottom: 12px"]) > div {
          width: 100% !important;
          max-width: none !important;
          height: 100dvh !important;
          max-height: 100dvh !important;
          border-radius: 0 !important;
          padding-top: calc(18px + env(safe-area-inset-top)) !important;
        }
      }
    </style>
    <script>
      (() => {
        const recoveryKey = "engage:blank-shell-recovery";

        async function recoverBlankShell() {
          if (sessionStorage.getItem(recoveryKey)) return;
          sessionStorage.setItem(recoveryKey, String(Date.now()));

          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => {
                const scriptUrl = registration.active?.scriptURL || registration.waiting?.scriptURL || registration.installing?.scriptURL || "";
                try {
                  const pathname = new URL(scriptUrl, location.href).pathname;
                  return pathname === "/sw.js" ? registration.unregister() : Promise.resolve(false);
                } catch {
                  return Promise.resolve(false);
                }
              }));
            }

            if ("caches" in window) {
              const names = await caches.keys();
              await Promise.all(names
                .filter((name) => /workbox|precache/i.test(name))
                .map((name) => caches.delete(name)));
            }
          } catch {
            // Recovery still continues with a cache-busting reload.
          }

          const url = new URL(location.href);
          url.searchParams.set("engage_recover", Date.now().toString());
          location.replace(url.toString());
        }

        window.addEventListener("error", (event) => {
          const target = event.target;
          if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) recoverBlankShell();
        }, true);

        window.addEventListener("DOMContentLoaded", () => {
          window.setTimeout(() => {
            const root = document.getElementById("root");
            if (root && root.childElementCount === 0 && !(root.textContent || "").trim()) recoverBlankShell();
          }, 6000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
