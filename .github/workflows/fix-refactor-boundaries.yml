name: Fix refactor boundaries
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-refactor-boundaries.py
      - .github/workflows/fix-refactor-boundaries.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/fix-refactor-boundaries.py
      - run: npm ci
      - name: Audit extracted module boundaries
        run: |
          cat > /tmp/eslint.config.mjs <<'EOF'
          export default [{
            files: ["src/**/*.js", "src/**/*.jsx"],
            languageOptions: {
              ecmaVersion: "latest",
              sourceType: "module",
              parserOptions: { ecmaFeatures: { jsx: true } },
              globals: {
                window: "readonly", document: "readonly", navigator: "readonly", localStorage: "readonly",
                fetch: "readonly", URLSearchParams: "readonly", CustomEvent: "readonly", Event: "readonly",
                requestAnimationFrame: "readonly", cancelAnimationFrame: "readonly", crypto: "readonly",
                setTimeout: "readonly", clearTimeout: "readonly"
              }
            },
            rules: { "no-undef": "error" }
          }];
          EOF
          npx --yes eslint@9 src/app/AppShellFeatures.jsx src/reports/ReportFeatures.jsx src/lead/LeadFeatures.jsx src/admin/AdminAppView.jsx --config /tmp/eslint.config.mjs
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      - name: Commit validated boundary fixes
        run: |
          rm scripts/fix-refactor-boundaries.py
          rm .github/workflows/fix-refactor-boundaries.yml
          rm -f .github/workflows/audit-refactor-boundaries.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "harden extracted feature boundaries"
          git push
