name: Fix shell export boundary
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-shell-export-boundary.py
      - .github/workflows/fix-shell-export-boundary.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/fix-shell-export-boundary.py
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      - name: Commit validated fix
        run: |
          rm scripts/fix-shell-export-boundary.py
          rm .github/workflows/fix-shell-export-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "restore shared shell exports"
          git push
