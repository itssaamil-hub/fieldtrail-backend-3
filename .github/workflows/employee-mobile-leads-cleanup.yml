name: Employee mobile leads cleanup

on:
  push:
    branches:
      - employee-mobile-leads-ui

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-mobile-leads-ui
          fetch-depth: 0
      - name: Restore generated tracked files
        run: |
          git fetch origin main
          git checkout origin/main -- dist node_modules
          rm .github/workflows/employee-mobile-leads-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean generated files from Leads UI change"
          git push origin employee-mobile-leads-ui
