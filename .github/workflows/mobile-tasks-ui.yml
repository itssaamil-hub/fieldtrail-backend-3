name: Mobile Tasks UI

on:
  push:
    branches:
      - employee-mobile-tasks-ui

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-mobile-tasks-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch
        run: python scripts/mobile_tasks_patch.py
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Commit
        run: |
          git restore --source=origin/main -- dist node_modules 2>/dev/null || true
          rm .github/workflows/mobile-tasks-ui.yml scripts/mobile_tasks_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Tasks.jsx src/tasks.css .github/workflows/mobile-tasks-ui.yml scripts/mobile_tasks_patch.py
          git commit -m "Polish mobile Tasks workspace"
          git push origin employee-mobile-tasks-ui
