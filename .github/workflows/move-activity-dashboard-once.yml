name: Finalize dashboard activity layout

on:
  push:
    paths:
      - '.github/workflows/move-activity-dashboard-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Keep map on dashboard only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          s = path.read_text()

          # Activity overview is already directly below the dashboard KPIs.
          dashboard_activity = '{showDashboard && !phone && <AdminActivityOverview salesmen={salesmen} />}'
          if dashboard_activity not in s:
              raise SystemExit('Dashboard activity overview not found')

          # Ensure no activity overview remains tied to Employees.
          if 'section === "employees" && !phone && <AdminActivityOverview' in s:
              raise SystemExit('Employee activity overview still present')

          old_open = '{mapView === "live" || (sectionNavigation && section === "employees") ? ('
          if old_open not in s:
              raise SystemExit('Employee-aware map block opening not found')
          s = s.replace(old_open, '{showDashboard && (mapView === "live" ? (', 1)

          old_grid = '<div className={sectionNavigation && section === "employees" ? undefined : "ft-dashboard-grid"}>'
          if old_grid not in s:
              raise SystemExit('Employee-aware map grid wrapper not found')
          s = s.replace(old_grid, '<div className="ft-dashboard-grid">', 1)

          old_live = '{(showDashboard || (sectionNavigation && section === "employees")) && <LiveMap'
          if old_live not in s:
              raise SystemExit('Employee-aware live map condition not found')
          s = s.replace(old_live, '<LiveMap', 1)

          # Find the closing of the filtered-map ternary and close the new
          # showDashboard wrapper as well.
          marker = 'subtitle="Respects the employee/status/date filters below"'
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('Filtered map marker not found')
          end = s.find('/>', pos)
          if end == -1:
              raise SystemExit('Filtered map component end not found')
          close = s.find(')}', end)
          if close == -1:
              raise SystemExit('Map ternary close not found')
          s = s[:close] + '))}' + s[close+2:]

          path.write_text(s)
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/move-activity-dashboard-once.yml
          git add src/App.jsx .github/workflows/move-activity-dashboard-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep activity and map on dashboard only"
          git push origin HEAD:main
