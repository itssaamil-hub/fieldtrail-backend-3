name: Finalize dashboard activity layout

on:
  push:
    paths:
      - '.github/workflows/move-activity-dashboard-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove map from Employees while keeping it on Dashboard
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          s = path.read_text()

          dashboard_activity = '{showDashboard && !phone && <AdminActivityOverview salesmen={salesmen} />}'
          if dashboard_activity not in s:
              raise SystemExit('Dashboard activity overview not found')
          if 'section === "employees" && !phone && <AdminActivityOverview' in s:
              raise SystemExit('Employee activity overview still present')

          live_old = '{(showDashboard || (sectionNavigation && section === "employees")) && <LiveMap'
          live_new = '{showDashboard && <LiveMap'
          if live_old not in s:
              raise SystemExit('Live map employee condition not found')
          s = s.replace(live_old, live_new, 1)

          filtered_old = '        <LiveMap\n          salesmen={[]}\n          leads={filteredLeads}'
          filtered_new = '        {showDashboard && <LiveMap\n          salesmen={[]}\n          leads={filteredLeads}'
          if filtered_old not in s:
              raise SystemExit('Filtered map opening not found')
          s = s.replace(filtered_old, filtered_new, 1)

          filtered_tail = '          </div>}\n        />\n      )}'
          filtered_tail_new = '          </div>}\n        />}\n      )}'
          if filtered_tail not in s:
              raise SystemExit('Filtered map closing not found')
          s = s.replace(filtered_tail, filtered_tail_new, 1)

          path.write_text(s)
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/move-activity-dashboard-once.yml
          git add src/App.jsx .github/workflows/move-activity-dashboard-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep activity and maps on dashboard only"
          git push origin HEAD:main
