name: Fix admin lead field options
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch form
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/AdminAddLeadModal.jsx')
          s=p.read_text()
          s=s.replace('salesmanId: activeSalesmen[0]?.id || "", business:"", subLocation:"", posName:"",\n    renewalMonth:', 'salesmanId: activeSalesmen[0]?.id || "", business:"", subLocation:"", posName:"", category:"",\n    renewalMonth:', 1)
          s=s.replace('const [leadSettings, setLeadSettings] = useState(null);\n  const [duplicateResult', 'const [leadSettings, setLeadSettings] = useState(null);\n  const [fieldOptions, setFieldOptions] = useState({ category:[], pos_name:[], sub_location:[] });\n  const [duplicateResult', 1)
          s=s.replace('api.adminGetSettings().then((res) => setLeadSettings(res.leadSettings || null)).catch(() => {});\n  }, []);', 'api.adminGetSettings().then((res) => setLeadSettings(res.leadSettings || null)).catch(() => {});\n    api.adminGetLeadOptions().then((res) => {\n      const options = res.options || {};\n      const values = (key) => (options[key] || []).map((item) => typeof item === "string" ? item : item.value).filter(Boolean);\n      setFieldOptions({ category:values("category"), pos_name:values("pos_name"), sub_location:values("sub_location") });\n    }).catch(() => {});\n  }, []);', 1)
          s=s.replace('posName:form.posName || null,\n        renewalMonth:', 'posName:form.posName || null,\n        category:form.category || null,\n        renewalMonth:', 1)
          old='''                <Field label="Sub Location / Branch"><input value={form.subLocation} onChange={set("subLocation")} placeholder="e.g. Gomti Nagar, Lucknow" style={input}/></Field>\n                <Field label="Current POS"><input value={form.posName} onChange={set("posName")} placeholder="e.g. Petpooja" style={input}/></Field>\n                <Field label="Renewal Month"><select value={form.renewalMonth} onChange={set("renewalMonth")} style={input}><option value="">Select renewal month</option>{MONTHS.map((m)=><option key={m}>{m}</option>)}</select></Field>'''
          new='''                <Field label="Sub Location / Branch"><input value={form.subLocation} onChange={set("subLocation")} placeholder="e.g. Gomti Nagar, Lucknow" style={input} list="admin-sub-location-options"/><datalist id="admin-sub-location-options">{fieldOptions.sub_location.map((v)=><option key={v} value={v}/>)}</datalist></Field>\n                <Field label="Current POS"><input value={form.posName} onChange={set("posName")} placeholder="e.g. Petpooja" style={input} list="admin-pos-name-options"/><datalist id="admin-pos-name-options">{fieldOptions.pos_name.map((v)=><option key={v} value={v}/>)}</datalist></Field>\n                <Field label="Category"><input value={form.category} onChange={set("category")} placeholder="e.g. Cafe" style={input} list="admin-category-options"/><datalist id="admin-category-options">{(fieldOptions.category.length ? fieldOptions.category : ["Cafe","QSR","Casual Dining","Fine Dining","Cloud Kitchen","Bakery"]).map((v)=><option key={v} value={v}/>)}</datalist></Field>\n                <Field label="Renewal Month"><select value={form.renewalMonth} onChange={set("renewalMonth")} style={input}><option value="">Select renewal month</option>{MONTHS.map((m)=><option key={m}>{m}</option>)}</select></Field>'''
          if old not in s: raise SystemExit('field anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit and remove helper workflow
        run: |
          rm .github/workflows/fix-admin-lead-field-options.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AdminAddLeadModal.jsx .github/workflows/fix-admin-lead-field-options.yml
          git commit -m 'fix: match admin lead field options with employee form'
          git push
