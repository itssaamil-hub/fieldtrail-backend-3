name: One-time native lead form refactor

on:
  push:
    paths:
      - '.github/workflows/native-lead-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply native React refactor
        run: python .github/scripts/native_lead_refactor.py
      - name: Verify frontend build
        run: npm ci && npm run build
      - name: Commit native React cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/App.jsx src/main.jsx src/leadBusinessNameEditEnhance.js src/addLeadStageDropdown.js
          git diff --cached --quiet && exit 0
          git commit -m "Move business name and stage controls into React"
          git push origin HEAD:main
