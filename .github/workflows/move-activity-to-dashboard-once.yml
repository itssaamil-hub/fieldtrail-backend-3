name: Move activity overview below dashboard KPIs

on:
  push:
    paths:
      - '.github/workflows/move-activity-to-dashboard-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Move Activity Centre to dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old='{section === "employees" && !phone && <AdminActivityOverview salesmen={salesmen} />}\n'
          if old not in s:
              raise SystemExit('employee activity placement not found')
          s=s.replace(old,'',1)
          anchor='''        <StatCard variant="dashboard" label="Renewals Due" sub="next 30 days" value={upcomingRenewals.length} icon={RefreshCw} color={T.accent} onClick={() => setStatLeadsModal({ title: "Renewals Due (Next 30 Days)", leads: upcomingRenewals })} />\n      </div>'''
          replacement=anchor+'\n      {showDashboard && !phone && <AdminActivityOverview salesmen={salesmen} />} '
          if anchor not in s:
              raise SystemExit('dashboard KPI anchor not found')
          s=s.replace(anchor,replacement,1)
          p.write_text(s)
          PY
      - name: Verify placement
        run: |
          grep -q 'showDashboard && !phone && <AdminActivityOverview' src/App.jsx
          ! grep -q 'section === "employees" && !phone && <AdminActivityOverview' src/App.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/move-activity-to-dashboard-once.yml
          git add -A src/App.jsx .github/workflows/move-activity-to-dashboard-once.yml
          git commit -m "fix: move activity centre below dashboard KPIs"
          git push origin HEAD:main
