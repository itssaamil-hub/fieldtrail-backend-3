name: Employee mobile leads UI

on:
  push:
    branches:
      - employee-mobile-leads-ui

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: employee-mobile-leads-ui
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply patch
        run: python3 scripts/employee_mobile_leads_ui_patch.py
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Commit verified changes
        run: |
          rm scripts/employee_mobile_leads_ui_patch.py
          rm .github/workflows/employee-mobile-leads-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve employee mobile leads filters"
          git push origin employee-mobile-leads-ui
