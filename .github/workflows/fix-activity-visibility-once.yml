name: Fix activity centre visibility
on:
  push:
    paths:
      - '.github/workflows/fix-activity-visibility-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make employee activity visibility robust
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/App.jsx';
          let s=fs.readFileSync(p,'utf8');
          const old='{sectionNavigation && section === "employees" && !phone && <AdminActivityOverview salesmen={salesmen} />}';
          const next='{section === "employees" && !phone && <AdminActivityOverview salesmen={salesmen} />}';
          if(!s.includes(old)) throw new Error('Target visibility condition not found');
          s=s.replace(old,next);
          fs.writeFileSync(p,s);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-activity-visibility-once.yml
          git add src/App.jsx .github/workflows/fix-activity-visibility-once.yml
          git commit -m "fix: show activity overview on employees desktop view"
          git push
