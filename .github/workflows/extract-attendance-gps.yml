name: One-time attendance GPS extraction

on:
  push:
    paths:
      - '.github/workflows/extract-attendance-gps.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract attendance GPS hook
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          app = app_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          app = replace_once(
              app,
              'import useUnreadNotifications from "./useUnreadNotifications.js";\n',
              'import useUnreadNotifications from "./useUnreadNotifications.js";\nimport useAttendanceGps from "./useAttendanceGps.js";\n',
              'attendance GPS import'
          )

          app = replace_once(
              app,
              '''// ---------------------------------------------------------------------------
// SALESMAN — real day start/end, a throttled real-GPS ping loop while the
// day is active, and an offline lead queue that actually retries against
// the server (backend dedupes on client_uuid, so retries are always safe).
// ---------------------------------------------------------------------------
const PING_MIN_INTERVAL_MS = 12000;

function SalesmanApp({ session, online, page, notificationLead }) {''',
              '''// ---------------------------------------------------------------------------
// SALESMAN — real day start/end and an offline lead queue that actually retries
// against the server. Attendance GPS tracking lives in useAttendanceGps.js.
// ---------------------------------------------------------------------------
function SalesmanApp({ session, online, page, notificationLead }) {''',
              'salesman section header'
          )

          app = replace_once(
              app,
              '''  const [monthlyTarget, setMonthlyTarget] = useState(200);
  const lastPingSentRef = useRef(0);
  const dayToggleInFlightRef = useRef(false);
''',
              '''  const [monthlyTarget, setMonthlyTarget] = useState(200);
  const dayToggleInFlightRef = useRef(false);
''',
              'remove GPS ping ref'
          )

          old = '''  // Real GPS tracking loop while the day is active.
  useEffect(() => {
    if (!dayStarted) { setGpsStatus("idle"); return; }
    if (!continuousTracking) { setGpsStatus("idle"); return; } // Continuous GPS Tracking turned off in settings
    if (!navigator.geolocation) { setGpsStatus("unavailable"); return; }

    const watchId = navigator.geolocation.watchPosition(
      async (pos) => {
        setGpsStatus("tracking");
        const { latitude: lat, longitude: lng, speed, accuracy } = pos.coords;
        const capturedAt = pos.timestamp || Date.now();
        api.cacheAttendanceLocation({ lat, lng, accuracy, capturedAt });
        const now = Date.now();
        if (now - lastPingSentRef.current < PING_MIN_INTERVAL_MS) return; // throttle network pings only
        lastPingSentRef.current = now;
        const batteryPct = await getBatteryPct();
        try {
          await api.salesmanPing({
            lat, lng,
            accuracyM: Math.round(accuracy),
            speedMps: speed || 0,
            batteryPct,
            isMockSuspected: false,
            capturedAt: new Date(capturedAt).toISOString(),
          });
        } catch {
          // A missed ping isn't fatal — the next watchPosition fix will retry.
        }
      },
      (err) => setGpsStatus(err.code === err.PERMISSION_DENIED ? "denied" : "unavailable"),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, [dayStarted, continuousTracking, getBatteryPct]);

  // Warm one accurate attendance fix without turning optional continuous tracking
  // into all-day tracking. Before Start Day this helps both modes; after Start Day
  // it only runs when Continuous GPS Tracking is OFF. Stop after 60s or <=50m.
  useEffect(() => {
    if (!navigator.geolocation) return;
    if (!attendanceLocationPolicy.start && !attendanceLocationPolicy.end) return;
    if (dayStarted && continuousTracking) return; // the active-day watcher above already keeps GPS warm

    let watchId = null;
    let stopTimer = null;

    const stopWarmup = () => {
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      if (stopTimer) clearTimeout(stopTimer);
      stopTimer = null;
    };

    const startWarmup = () => {
      if (document.hidden || watchId != null) return;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude: lat, longitude: lng, accuracy } = pos.coords;
          api.cacheAttendanceLocation({
            lat,
            lng,
            accuracy,
            capturedAt: pos.timestamp || Date.now(),
          });
          if (Number.isFinite(accuracy) && accuracy <= 50) stopWarmup();
        },
        (err) => {
          // Do not keep prompting/retrying a denied warm-up. The attendance
          // resolver will surface the precise error if Start/End is tapped.
          if (err.code === err.PERMISSION_DENIED) stopWarmup();
        },
        { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 }
      );
      stopTimer = setTimeout(stopWarmup, 60000);
    };

    const onVisibility = () => {
      if (document.hidden) stopWarmup();
      else startWarmup();
    };

    startWarmup();
    document.addEventListener("visibilitychange", onVisibility);
    window.addEventListener("focus", startWarmup);
    return () => {
      stopWarmup();
      document.removeEventListener("visibilitychange", onVisibility);
      window.removeEventListener("focus", startWarmup);
    };
  }, [dayStarted, continuousTracking, attendanceLocationPolicy.start, attendanceLocationPolicy.end]);
'''

          new = '''  useAttendanceGps({
    dayStarted,
    continuousTracking,
    attendanceLocationPolicy,
    setGpsStatus,
    getBatteryPct,
  });
'''

          app = replace_once(app, old, new, 'attendance GPS effects')
          app_path.write_text(app)

          hook = '''import { useEffect, useRef } from "react";
import { api } from "./api.js";

const PING_MIN_INTERVAL_MS = 12000;

export default function useAttendanceGps({
  dayStarted,
  continuousTracking,
  attendanceLocationPolicy,
  setGpsStatus,
  getBatteryPct,
}) {
  const lastPingSentRef = useRef(0);

  // Real GPS tracking loop while the day is active.
  useEffect(() => {
    if (!dayStarted) { setGpsStatus("idle"); return; }
    if (!continuousTracking) { setGpsStatus("idle"); return; }
    if (!navigator.geolocation) { setGpsStatus("unavailable"); return; }

    const watchId = navigator.geolocation.watchPosition(
      async (pos) => {
        setGpsStatus("tracking");
        const { latitude: lat, longitude: lng, speed, accuracy } = pos.coords;
        const capturedAt = pos.timestamp || Date.now();
        api.cacheAttendanceLocation({ lat, lng, accuracy, capturedAt });

        const now = Date.now();
        if (now - lastPingSentRef.current < PING_MIN_INTERVAL_MS) return;
        lastPingSentRef.current = now;

        const batteryPct = await getBatteryPct();
        try {
          await api.salesmanPing({
            lat,
            lng,
            accuracyM: Math.round(accuracy),
            speedMps: speed || 0,
            batteryPct,
            isMockSuspected: false,
            capturedAt: new Date(capturedAt).toISOString(),
          });
        } catch {
          // A missed ping is non-fatal; the next watchPosition fix retries.
        }
      },
      (err) => setGpsStatus(err.code === err.PERMISSION_DENIED ? "denied" : "unavailable"),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );

    return () => navigator.geolocation.clearWatch(watchId);
  }, [dayStarted, continuousTracking, getBatteryPct, setGpsStatus]);

  // Warm one accurate attendance fix without turning optional continuous tracking
  // into all-day tracking. Stop after 60 seconds or once accuracy reaches <=50m.
  useEffect(() => {
    if (!navigator.geolocation) return;
    if (!attendanceLocationPolicy.start && !attendanceLocationPolicy.end) return;
    if (dayStarted && continuousTracking) return;

    let watchId = null;
    let stopTimer = null;

    const stopWarmup = () => {
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      if (stopTimer) clearTimeout(stopTimer);
      stopTimer = null;
    };

    const startWarmup = () => {
      if (document.hidden || watchId != null) return;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude: lat, longitude: lng, accuracy } = pos.coords;
          api.cacheAttendanceLocation({
            lat,
            lng,
            accuracy,
            capturedAt: pos.timestamp || Date.now(),
          });
          if (Number.isFinite(accuracy) && accuracy <= 50) stopWarmup();
        },
        (err) => {
          if (err.code === err.PERMISSION_DENIED) stopWarmup();
        },
        { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 }
      );
      stopTimer = setTimeout(stopWarmup, 60000);
    };

    const onVisibility = () => {
      if (document.hidden) stopWarmup();
      else startWarmup();
    };

    startWarmup();
    document.addEventListener("visibilitychange", onVisibility);
    window.addEventListener("focus", startWarmup);

    return () => {
      stopWarmup();
      document.removeEventListener("visibilitychange", onVisibility);
      window.removeEventListener("focus", startWarmup);
    };
  }, [dayStarted, continuousTracking, attendanceLocationPolicy.start, attendanceLocationPolicy.end]);
}
'''
          Path('src/useAttendanceGps.js').write_text(hook)
          PY
      - name: Verify frontend build
        run: npm ci && npm run build
      - name: Commit extraction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/extract-attendance-gps.yml
          git add -A src/App.jsx src/useAttendanceGps.js .github/workflows/extract-attendance-gps.yml
          git diff --cached --quiet && exit 0
          git commit -m "extract attendance GPS hook from App"
          git push origin HEAD:main
