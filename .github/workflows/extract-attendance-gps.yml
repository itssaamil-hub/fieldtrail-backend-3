name: One-time attendance GPS extraction

on:
  push:
    paths:
      - '.github/workflows/extract-attendance-gps.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract attendance GPS hook
        run: |
          echo '' | base64 -d > /tmp/extract_attendance_gps.py
          python /tmp/extract_attendance_gps.py
      - name: Verify frontend build
        run: npm ci && npm run build
      - name: Commit extraction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/extract-attendance-gps.yml
          git add -A src/App.jsx src/useAttendanceGps.js .github/workflows/extract-attendance-gps.yml
          git diff --cached --quiet && exit 0
          git commit -m "extract attendance GPS hook from App"
          git push origin HEAD:main
