name: Fix activity graph bottom alignment

on:
  push:
    paths:
      - '.github/workflows/fix-activity-graph-bottom.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Align graph to bottom of card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/AdminActivityOverview.jsx')
          s = p.read_text()
          old1 = "return <div style={{width:'100%',overflowX:'auto',marginTop:4}}>"
          new1 = "return <div style={{width:'100%',overflowX:'auto',marginTop:'auto',paddingTop:4}}>"
          old2 = "<section style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16,minWidth:0,boxShadow:'0 1px 2px rgba(15,23,42,.03)'}}>"
          new2 = "<section style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16,minWidth:0,boxShadow:'0 1px 2px rgba(15,23,42,.03)',display:'flex',flexDirection:'column'}}>"
          if old1 not in s:
              raise SystemExit('SparkChart wrapper target not found')
          if old2 not in s:
              raise SystemExit('Lead Activity section target not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Install and verify build
        run: |
          npm ci
          npm run build
      - name: Commit verified change and remove workflow
        run: |
          rm .github/workflows/fix-activity-graph-bottom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AdminActivityOverview.jsx .github/workflows/fix-activity-graph-bottom.yml
          git commit -m "ui: align lead activity graph to card bottom"
          git push
