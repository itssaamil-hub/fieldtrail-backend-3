name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Guard React source against undefined runtime identifiers
        run: |
          FILES=$(find src -type f \( -name '*.jsx' -o -name '*.tsx' \) -print | tr '\n' ' ')
          npx --yes eslint@8 $FILES \
            --no-eslintrc \
            --env es6,browser \
            --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' \
            --rule 'no-undef:error'
      - name: Guard JS source against undefined identifiers
        run: |
          FILES=$(find src -type f -name '*.js' ! -name '*sw*' ! -name 'service-worker.js' -print | tr '\n' ' ')
          npx --yes eslint@8 $FILES \
            --no-eslintrc \
            --env es6,browser,node \
            --global globalThis \
            --parser-options '{"ecmaVersion":2022,"sourceType":"module"}' \
            --rule 'no-undef:error'
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      - name: Install Playwright smoke-test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run isolated UI smoke tests
        run: npx playwright test
      - name: Upload smoke-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
