name: Final frontend hardening
on:
  push:
    paths:
      - 'tools/final_frontend_hardening.py'
      - '.github/workflows/final-frontend-hardening.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove verified dead enhancer code
        run: python tools/final_frontend_hardening.py
      - name: Remove one-time final migration tooling
        run: rm -f tools/final_frontend_hardening.py .github/workflows/final-frontend-hardening.yml
      - run: npm ci
      - name: Final production build
        run: npm run build
      - name: Commit hardened frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Remove legacy frontend enhancer layer"
            git push
          fi
