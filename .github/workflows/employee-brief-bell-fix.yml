name: Employee brief and bell fix

on:
  push:
    branches:
      - employee-brief-bell-fix

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-brief-bell-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Patch
        run: |
          python3 scripts/patch_employee_ui.py
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Commit
        run: |
          git restore --source=origin/main -- dist node_modules 2>/dev/null || true
          rm .github/workflows/employee-brief-bell-fix.yml scripts/patch_employee_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/index.css .github/workflows/employee-brief-bell-fix.yml scripts/patch_employee_ui.py
          git commit -m "Polish employee Brief and notification badge"
          git push origin employee-brief-bell-fix