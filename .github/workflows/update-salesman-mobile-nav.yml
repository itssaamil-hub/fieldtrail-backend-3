name: Update salesman mobile navigation

on:
  push:
    paths:
      - '.github/workflows/update-salesman-mobile-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply employee mobile navigation update
        run: node .github/scripts/update-salesman-mobile-nav.cjs
      - name: Install dependencies
        run: npm ci
      - name: Guard React source against undefined identifiers
        run: |
          FILES=$(find src -type f \( -name '*.jsx' -o -name '*.tsx' \) -print | tr '\n' ' ')
          npx --yes eslint@8 $FILES --no-eslintrc --env es6,browser --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' --rule 'no-undef:error'
      - name: Production build
        run: npm run build
      - name: Install Playwright smoke-test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run UI smoke tests
        run: npx playwright test
      - name: Commit validated navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AdminMobileNav.jsx src/salesman/SalesmanView.jsx tests/smoke.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m "refine employee mobile lead navigation"
          git push origin HEAD:main
