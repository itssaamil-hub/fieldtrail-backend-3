name: Round Brief pill

on:
  push:
    branches: [round-brief-pill]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round-brief-pill
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Round Brief buttons everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/index.css')
          s=p.read_text()
          old='''.ft-lead-brief-pill {\n  background: #F1EAFE !important;\n  color: #7450C7 !important;\n  border-color: transparent !important;\n  box-shadow: none !important;\n}'''
          new='''.ft-lead-brief-pill {\n  background: #F1EAFE !important;\n  color: #7450C7 !important;\n  border-color: transparent !important;\n  border-radius: 999px !important;\n  box-shadow: none !important;\n}'''
          assert old in s, 'global Brief style not found'
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Commit verified change
        run: |
          rm .github/workflows/round-brief-pill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css .github/workflows/round-brief-pill.yml
          git commit -m "Round Brief pill everywhere"
          git push origin round-brief-pill
