name: Direct quotation delete patch

on:
  push:
    branches: [fix/direct-quotation-delete-jsx]
    paths: [.github/workflows/direct-quotation-delete-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-quotation-delete-jsx
      - name: Patch real quotation menu condition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/Quotations.jsx')
          s=p.read_text()
          old="{canDelete&&<button className=\"ft-q-danger\" disabled={busy} onClick={()=>{setDeleteReason('');setConfirmDelete(true)}}>Delete quotation</button>}"
          new="{effectiveStatus!=='voided'&&<button className=\"ft-q-danger\" disabled={busy} onClick={()=>{setDeleteReason('');setConfirmDelete(true)}}>Delete quotation</button>}"
          if old not in s:
              raise SystemExit('Target delete condition not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove temporary quotation policy adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text().replace('import "./quotationDeletePolicy.js";\n','')
          p.write_text(s)
          PY
          rm -f src/quotationDeletePolicy.js
          rm -f .github/workflows/direct-quotation-delete-patch.yml
      - name: Commit direct source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Quotations.jsx src/main.jsx src/quotationDeletePolicy.js .github/workflows/direct-quotation-delete-patch.yml
          git commit -m 'Render Delete quotation directly for active quotations'
          git push origin HEAD:fix/direct-quotation-delete-jsx
