name: Hide salesman payment currency

on:
  push:
    paths:
      - '.github/workflows/hide-salesman-payment-currency.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hide currency selector from salesman Payment Due
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/Collections.jsx')
          s=p.read_text()
          old='<div className="ft-col-filters"><label className="ft-ob-field">Currency<select value={currency} onChange={e=>{setCurrency(e.target.value);setOffset(0)}}>{[\'INR\',\'AED\',\'SAR\'].map(c=><option key={c}>{c}</option>)}</select></label>{admin&&<label className="ft-ob-field">Salesman'
          new='<div className="ft-col-filters">{admin&&<label className="ft-ob-field">Currency<select value={currency} onChange={e=>{setCurrency(e.target.value);setOffset(0)}}>{[\'INR\',\'AED\',\'SAR\'].map(c=><option key={c}>{c}</option>)}</select></label>}{admin&&<label className="ft-ob-field">Salesman'
          if old not in s:
              raise SystemExit('currency selector anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Guard React source
        run: |
          FILES=$(find src -type f \( -name '*.jsx' -o -name '*.tsx' \) -print | tr '\n' ' ')
          npx --yes eslint@8 $FILES --no-eslintrc --env es6,browser --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' --rule 'no-undef:error'
      - name: Production build
        run: npm run build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Collections.jsx
          git diff --cached --quiet && exit 0
          git commit -m "hide currency selector from salesman payment due"
          git push origin HEAD:main
