name: Global violet Brief style

on:
  push:
    branches: [global-violet-brief]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-violet-brief
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply global Brief style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.css')
          s = p.read_text()
          marker = '/* Global Brief action: unified violet pill across Engage. */'
          if marker not in s:
              s += '''\n\n/* Global Brief action: unified violet pill across Engage. */\n.ft-lead-brief-pill {\n  background: #F1EAFE !important;\n  color: #7450C7 !important;\n  border-color: transparent !important;\n  box-shadow: none !important;\n}\n.ft-lead-brief-pill svg {\n  color: #7450C7 !important;\n  stroke: #7450C7 !important;\n}\n'''
              p.write_text(s)
          PY
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Commit verified source changes
        run: |
          git restore --source=origin/main -- dist node_modules 2>/dev/null || true
          rm .github/workflows/global-violet-brief.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css .github/workflows/global-violet-brief.yml
          git commit -m "Use violet Brief pill everywhere"
          git push origin global-violet-brief
