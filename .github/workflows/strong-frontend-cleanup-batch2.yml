name: Strong frontend cleanup batch 2

on:
  push:
    paths:
      - 'tools/strong_frontend_cleanup_batch2.py'
      - '.github/workflows/strong-frontend-cleanup-batch2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dashboard React consolidation
        run: python tools/strong_frontend_cleanup_batch2.py
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Move dashboard enhancements into React"
            git push
          fi
