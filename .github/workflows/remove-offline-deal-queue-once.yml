name: Remove offline deal queue once

on:
  push:
    branches:
      - chore/remove-offline-deal-queue

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-offline-deal-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded online-only Deal changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f"{label}: expected 1 match, found {count}"
              return text.replace(old, new, 1)

          # 1) Salesman lead data hook: server-confirmed writes only; no local transaction queue.
          p = 'src/useSalesmanLeads.js'
          s = read(p)
          s = replace_once(s, "import { legacyQueueCount, flushOfflineLeads, queueReadError } from './offlineLeadQueue.js';\n", "", 'offline queue import')
          s = replace_once(s, "  getQueuedLeads,\n  pushQueuedLead,\n  removeQueuedLead,\n", "", 'offline queue API imports')
          s = replace_once(s, "const QUEUE_RETRY_BASE_MS = 20000;\nconst QUEUE_RETRY_JITTER_MS = 10000;\n", "", 'queue retry constants')
          s = replace_once(s, "export default function useSalesmanLeads({ online, session, setLoadError, makeQueuedLead }) {", "export default function useSalesmanLeads({ session, setLoadError }) {", 'hook signature')
          s = replace_once(s, "  const [queuedCount, setQueuedCount] = useState(getQueuedLeads(session.id).length);\n  const queueFlightRef = useRef(null);\n", "", 'queue state')
          s = replace_once(s, "  const makeQueuedLeadRef = useRef(makeQueuedLead);\n\n  useEffect(() => {\n    makeQueuedLeadRef.current = makeQueuedLead;\n  }, [makeQueuedLead]);\n\n", "", 'queued lead ref')
          s = replace_once(s,
              "      const queued = getQueuedLeads(session.id).map((payload) => ({ ...makeQueuedLeadRef.current(payload), syncStatus: \"queued\" }));\n      const next = mergeUnique(queued, mapped);\n      setLeads(next);",
              "      setLeads(mapped);",
              'merge queued leads')
          s = replace_once(s,
              "      setLoadError(queueReadError(session.id) || (legacyQueueCount() ? \"Older offline deals are preserved on this device. Their owner must be verified before they can sync.\" : \"\"));",
              "      setLoadError(\"\");",
              'offline load warning')
          pattern = re.compile(r"\n  const flushQueue = useCallback\(\(\) => \{.*?\n  const handleAddLead = async payload => \{", re.S)
          s, n = pattern.subn("\n  const handleAddLead = async payload => {", s, count=1)
          assert n == 1, f'queue engine block: expected 1 match, found {n}'
          pattern = re.compile(r"  const handleAddLead = async payload => \{.*?\n  \};\n\n  const saveLeadUpdate", re.S)
          replacement = '''  const handleAddLead = async payload => {
    try {
      const res = await api.salesmanCreateLead(payload, session.id);
      const mapped = mapLeadRow({ ...res.lead, salesman_name: session.fullName });
      if (mountedRef.current && getSession()?.id === session.id) {
        setLeads(prev => mergeUnique([mapped], prev));
        if (!res.deduped) setTotal(value => value + 1);
        setLoadError("");
        refreshSummary();
      }
      return { ok: true, lead: mapped };
    } catch (err) {
      return { ok: false, error: err?.message || "The deal was not saved. Check your connection and try again." };
    }
  };

  const saveLeadUpdate'''
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, f'handleAddLead replacement: expected 1 match, found {n}'
          s = replace_once(s, "    queuedCount,\n", "", 'queued count return')
          s = replace_once(s, "    totalLeadCount: total + queuedCount,", "    totalLeadCount: total,", 'total lead count')
          for forbidden in ['flushOfflineLeads', 'getQueuedLeads', 'pushQueuedLead', 'removeQueuedLead', 'queuedCount', 'queueReadError', 'legacyQueueCount', 'syncStatus: "queued"']:
              assert forbidden not in s, f'{p}: leftover offline symbol {forbidden}'
          write(p, s)

          # 2) Salesman view: remove offline-sync banner only. Connectivity remains available to online-only features.
          p = 'src/salesman/SalesmanView.jsx'
          s = read(p)
          s = replace_once(s, "Loader2, WifiOff, Target as TargetIcon", "Loader2, Target as TargetIcon", 'WifiOff import')
          s = replace_once(s, "gpsStatus, queuedCount, loadError", "gpsStatus, loadError", 'queuedCount prop')
          banner = re.compile(r"\n      \{\(!online \|\| queuedCount > 0\) && \(\n        <div.*?\n      \)\}\n", re.S)
          s, n = banner.subn("\n", s, count=1)
          assert n == 1, f'offline dashboard banner: expected 1 match, found {n}'
          assert 'queuedCount' not in s and 'saved on this device' not in s, 'salesman view still advertises offline saves'
          write(p, s)

          # 3) Lead UI: Add Deal stays open on failure, but an offline click is explicitly not saved.
          p = 'src/lead/LeadFeaturesCore.jsx'
          s = read(p)
          s = replace_once(s,
              "VerificationStamp, SyncBadge, NoLocationBadge",
              "VerificationStamp, NoLocationBadge",
              'SyncBadge dependency')
          s = replace_once(s, ", Loader2, AlertTriangle, WifiOff, Navigation", ", Loader2, AlertTriangle, Navigation", 'WifiOff dependency')
          s = replace_once(s,
              "// SALESMAN — real day start/end, a throttled real-GPS ping loop while the\n// day is active, and an offline lead queue that actually retries against\n// the server (backend dedupes on client_uuid, so retries are always safe).",
              "// SALESMAN — real day start/end, a throttled real-GPS ping loop while the\n// day is active, with Deal writes confirmed by the server before they appear saved.",
              'salesman comment')
          s = replace_once(s, "    queuedCount,\n", "", 'queued count destructure')
          s = replace_once(s,
              "  } = useSalesmanLeads({\n    online,\n    session,\n    setLoadError,\n    makeQueuedLead: (payload) => adHocLeadFromPayload(payload, session),\n  });",
              "  } = useSalesmanLeads({ session, setLoadError });",
              'hook invocation')
          s = replace_once(s, "      queuedCount={queuedCount}\n", "", 'queued count SalesmanView prop')
          s = replace_once(s, "              <SyncBadge syncStatus={l.syncStatus} />\n", "", 'sync badge rendering')
          s = replace_once(s,
              "  const handleSubmit = async () => {\n    if (!canSubmit) return;\n",
              "  const handleSubmit = async () => {\n    if (!canSubmit) return;\n    if (!online) {\n      setError(\"No connection — this deal has not been saved. Reconnect and try again.\");\n      return;\n    }\n",
              'online-only submit guard')
          offline_form = re.compile(r"\n      \{!online && \(\n        <div.*?Offline — this will save to your device and sync when reconnected\..*?\n      \)\}\n", re.S)
          s, n = offline_form.subn("\n", s, count=1)
          assert n == 1, f'offline Add Deal banner: expected 1 match, found {n}'
          s = replace_once(s, '{submitting ? "Saving…" : online ? "Save Lead" : "Save Lead (offline)"}', '{submitting ? "Saving…" : "Save Lead"}', 'offline save button label')
          adhoc = re.compile(r"\nfunction adHocLeadFromPayload\(payload, session\) \{.*?\n\}\n\n\nconst DEFAULT_LEAD_SETTINGS", re.S)
          s, n = adhoc.subn("\nconst DEFAULT_LEAD_SETTINGS", s, count=1)
          assert n == 1, f'ad hoc offline lead mapper: expected 1 match, found {n}'
          s = replace_once(s, "SalesmanApp, adHocLeadFromPayload, MessagesSection", "SalesmanApp, MessagesSection", 'return ad hoc mapper')
          for forbidden in ['queuedCount', 'Save Lead (offline)', 'save to your device and sync', 'syncStatus={l.syncStatus}', 'adHocLeadFromPayload']:
              assert forbidden not in s, f'{p}: leftover offline symbol/text {forbidden}'
          write(p, s)

          # 4) Root wiring: remove offline queue imports/dependencies only.
          p = 'src/App.jsx'
          s = read(p)
          s = replace_once(s, "  getQueuedLeads,\n  pushQueuedLead,\n  removeQueuedLead,\n", "", 'App offline API imports')
          s = replace_once(s, "VerificationStamp, SyncBadge, NoLocationBadge", "VerificationStamp, NoLocationBadge", 'App SyncBadge dependency')
          s = replace_once(s, "SalesmanApp, adHocLeadFromPayload, MessagesSection", "SalesmanApp, MessagesSection", 'App ad hoc mapper destructure')
          for forbidden in ['getQueuedLeads', 'pushQueuedLead', 'removeQueuedLead', 'adHocLeadFromPayload']:
              assert forbidden not in s, f'{p}: leftover offline symbol {forbidden}'
          write(p, s)

          # 5) API: retain account/session safety, remove queue API and offline-specific wording.
          p = 'src/api.js'
          s = read(p)
          s = replace_once(s, "export { getQueuedLeads, setQueuedLeads, pushQueuedLead, removeQueuedLead } from './offlineLeadQueue.js';\n", "", 'offline API re-export')
          s = replace_once(s, 'const LS_QUEUED_LEADS = "fieldtrail:queuedLeads";\n', '', 'offline storage constant')
          s = replace_once(s,
              'if (expectedUserId && (session?.id !== expectedUserId || !session?.token)) throw new ApiError("Account changed. The offline deal remains saved for its owner.", 401);',
              'if (expectedUserId && (session?.id !== expectedUserId || !session?.token)) throw new ApiError("Account changed. Please sign in again before saving.", 401);',
              'account changed wording')
          for forbidden in ['offlineLeadQueue', 'LS_QUEUED_LEADS', 'offline deal remains saved']:
              assert forbidden not in s, f'{p}: leftover offline symbol/text {forbidden}'
          write(p, s)

          # 6) Keep the cross-account write protection test, but remove stale queue wording.
          p = 'tests/critical-deals.spec.mjs'
          s = read(p)
          s = replace_once(s,
              "test('API refuses a queued request after login changes and never sends the other employee token'",
              "test('API refuses a salesman write after login changes and never sends the other employee token'",
              'critical test title')
          write(p, s)

          # 7) Remove the transaction queue implementation and its queue-specific unit tests.
          for dead in ['src/offlineLeadQueue.js', 'test/offlineLeadQueue.test.js']:
              path = Path(dead)
              assert path.exists(), f'missing expected offline file: {dead}'
              path.unlink()

          # Final repository-level guards for transaction queue names in active source/test code.
          roots = [Path('src'), Path('test'), Path('tests')]
          leftovers = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.js', '.jsx', '.mjs', '.cjs'}:
                      continue
                  text = path.read_text(errors='ignore')
                  if 'offlineLeadQueue' in text or 'fieldtrail:queuedLeads' in text or 'Save Lead (offline)' in text:
                      leftovers.append(str(path))
          assert not leftovers, f'offline transaction queue references remain: {leftovers}'
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit verified cleanup and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/remove-offline-deal-queue-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "remove offline Deal transaction queue"
          git push origin HEAD:chore/remove-offline-deal-queue
