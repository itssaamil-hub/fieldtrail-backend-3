name: Remove offline deal queue once

on:
  push:
    branches:
      - chore/remove-offline-deal-queue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-offline-deal-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply guarded cleanup
        run: python tools/run_remove_offline_cleanup.py
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit verified cleanup
        shell: bash
        run: |
          rm .github/workflows/remove-offline-deal-queue-once.yml tools/remove_offline_deal_queue_once.py tools/run_remove_offline_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "remove offline Deal transaction queue"
          git push origin HEAD:chore/remove-offline-deal-queue
