name: Map header controls cleanup

on:
  push:
    paths:
      - '.github/workflows/map-header-controls-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: python3 .github/scripts/map_header_fix.py
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/map-header-controls-fix.yml
          rm .github/scripts/map_header_fix.py
          git add src/App.jsx .github/workflows/map-header-controls-fix.yml .github/scripts/map_header_fix.py
          git commit -m "Move map controls into map header"
          git push
