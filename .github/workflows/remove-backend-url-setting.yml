name: Remove backend URL setting

on:
  push:
    paths:
      - '.github/workflows/remove-backend-url-setting.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove user-editable backend URL and localStorage override
        shell: python
        run: |
          from pathlib import Path

          api = Path('src/api.js')
          s = api.read_text()
          old = '''const LS_API_BASE = "fieldtrail:apiBase";\n'''
          assert old in s, 'LS_API_BASE declaration not found'
          s = s.replace(old, '', 1)

          old = '''export function getApiBase() {\n  return localStorage.getItem(LS_API_BASE) || import.meta.env.VITE_API_BASE_URL || "";\n}\nexport function setApiBase(url) {\n  const clean = url.trim().replace(/\\/+$/, "");\n  localStorage.setItem(LS_API_BASE, clean);\n}\nexport function clearApiBase() {\n  localStorage.removeItem(LS_API_BASE);\n}\n'''
          new = '''export function getApiBase() {\n  return String(import.meta.env.VITE_API_BASE_URL || "").trim().replace(/\\/+$/, "");\n}\n'''
          assert old in s, 'API base override block not found'
          s = s.replace(old, new, 1)
          assert 'fieldtrail:apiBase' not in s
          api.write_text(s)

          app = Path('src/App.jsx')
          s = app.read_text()
          assert '  setApiBase,\n' in s, 'setApiBase import not found'
          s = s.replace('  setApiBase,\n', '', 1)

          old = '  const [apiBase, setApiBaseState] = useState(getApiBase());\n'
          assert old in s, 'apiBase state line not found'
          s = s.replace(old, '  const apiBase = getApiBase();\n', 1)

          old = '''  const handleSaveApiBase = (url) => {\n    const changed = url !== apiBase;\n    setApiBase(url);\n    setApiBaseState(url);\n    if (changed && session) {\n      clearSession();\n      setSessionState(null);\n    }\n  };\n'''
          assert old in s, 'handleSaveApiBase block not found'
          s = s.replace(old, '', 1)

          old = '    body = <ConnectBackendScreen onSave={handleSaveApiBase} />;\n'
          new = '''    body = <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", background: T.paper, padding: 24 }}>\n      <div style={{ maxWidth: 460, width: "100%", background: T.card, border: `1px solid ${T.line}`, borderRadius: 16, padding: 24, textAlign: "center" }}>\n        <div style={{ fontSize: 18, fontWeight: 800, color: T.ink }}>Backend unavailable</div>\n        <div style={{ fontSize: 13, color: T.inkSoft, marginTop: 8 }}>The production backend is not configured for this app. Please contact the administrator.</div>\n      </div>\n    </div>;\n'''
          assert old in s, 'ConnectBackendScreen body usage not found'
          s = s.replace(old, new, 1)

          old = '''function SettingsModal({ apiBase, onClose, onSave, onLogout, onOpenCrmSettings, onOpenDataHealth, onOpenOnboardingSettings, onOpenQuotationSettings, canInstall, installed, promptInstall, push }) {\n  const [url, setUrl] = useState(apiBase || "");\n'''
          new = '''function SettingsModal({ onClose, onLogout, onOpenCrmSettings, onOpenDataHealth, onOpenOnboardingSettings, onOpenQuotationSettings, canInstall, installed, promptInstall, push }) {\n'''
          assert old in s, 'SettingsModal signature/url state not found'
          s = s.replace(old, new, 1)

          old = '''      <div style={{ fontSize: 11, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8 }}>Backend</div>\n      <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 12 }}>\n        Changing this will sign you out, since sessions are tied to a specific backend.\n      </div>\n      <Field label="Backend URL">\n        <input style={inputStyle} value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://your-backend.up.railway.app" autoCapitalize="none" autoCorrect="off" />\n      </Field>\n      <button\n        onClick={() => onSave(url.trim().replace(/\\/+$/, ""))}\n        disabled={!url.trim()}\n        style={{ width: "100%", padding: "12px", borderRadius: 11, border: "none", cursor: url.trim() ? "pointer" : "not-allowed", background: url.trim() ? T.route : "#C7CDD6", color: "#fff", fontWeight: 700, fontSize: 14.5 }}\n      >\n        Save\n      </button>\n'''
          assert old in s, 'Backend settings UI block not found'
          s = s.replace(old, '', 1)

          s = s.replace('          apiBase={apiBase}\n', '', 1)
          old = '          onSave={(url) => { handleSaveApiBase(url); setShowSettings(false); }}\n'
          assert old in s, 'SettingsModal onSave prop not found'
          s = s.replace(old, '', 1)

          assert 'Changing this will sign you out' not in s
          assert 'onSave={(url) => { handleSaveApiBase' not in s
          assert 'setApiBase(' not in s
          app.write_text(s)
      - name: Install and verify build
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          npm run build
      - name: Commit verified change and remove workflow
        run: |
          rm .github/workflows/remove-backend-url-setting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api.js src/App.jsx .github/workflows/remove-backend-url-setting.yml
          git commit -m "ui: remove backend URL setting and browser override"
          git push
