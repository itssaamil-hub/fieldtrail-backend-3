name: Extract admin employees

on:
  push:
    paths:
      - 'scripts/extract-admin-employees.py'
      - '.github/workflows/extract-admin-employees.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/extract-admin-employees.py
      - run: npm ci
      - run: npm run build
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/extract-admin-employees.py .github/workflows/extract-admin-employees.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "extract admin employees feature module"
          git push origin HEAD:main
