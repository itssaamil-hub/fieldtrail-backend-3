name: Data Health UI check

on:
  push:
    paths:
      - '.github/workflows/data-health-ui-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Remove temporary workflow after successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/data-health-ui-check.yml
          git add .github/workflows/data-health-ui-check.yml
          git commit -m "Remove temporary Data Health build check"
          git push
