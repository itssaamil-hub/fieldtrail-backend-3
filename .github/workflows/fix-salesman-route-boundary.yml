name: Fix SalesmanRouteModal boundary

on:
  push:
    paths:
      - '.github/workflows/fix-salesman-route-boundary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply route modal boundary fix
        run: node .github/scripts/fix-salesman-route-boundary.cjs
      - name: Install dependencies
        run: npm ci
      - name: Undefined identifier audit
        run: >-
          npx --yes eslint@8 src/admin/AdminAppView.jsx
          --no-eslintrc
          --env es6,browser
          --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}'
          --rule 'no-undef:error'
      - name: Production build
        run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/admin/AdminAppView.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix salesman route modal dependency"
          git push origin HEAD:main
