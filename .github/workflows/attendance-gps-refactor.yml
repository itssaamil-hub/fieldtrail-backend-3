name: One-time attendance GPS refactor

on:
  push:
    paths:
      - '.github/workflows/attendance-gps-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply attendance GPS refactor
        run: python .github/scripts/attendance_gps_refactor.py
      - name: Verify frontend build
        run: npm ci && npm run build
      - name: Commit attendance GPS refactor and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/attendance_gps_refactor.py .github/workflows/attendance-gps-refactor.yml
          git add -A src/App.jsx src/api.js .github/scripts/attendance_gps_refactor.py .github/workflows/attendance-gps-refactor.yml
          git diff --cached --quiet && exit 0
          git commit -m "finalize fast audited attendance GPS flow"
          git push origin HEAD:main
