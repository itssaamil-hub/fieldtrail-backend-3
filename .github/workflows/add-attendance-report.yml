name: Add attendance report

on:
  push:
    paths:
      - '.github/workflows/add-attendance-report.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wire attendance report into reports
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()

          old='const DataHealth = lazyDefault(() => import("./DataHealth.jsx"));'
          new=old+'\nconst AttendanceReport = lazyDefault(() => import("./AttendanceReport.jsx"));'
          if 'const AttendanceReport = lazyDefault' not in s:
              if old not in s: raise SystemExit('lazy import anchor not found')
              s=s.replace(old,new,1)

          daily='  { key: "daily", title: "Daily activity", desc: "Visits, leads touched and distance travelled per day.", icon: MapPin, color: "#12805C" },'
          attendance='  { key: "attendance", title: "Attendance Report", desc: "Start day, end day, working duration and day closing status.", icon: Clock, color: "#145C5D" },\n'+daily
          if 'key: "attendance"' not in s:
              if daily not in s: raise SystemExit('daily report card anchor not found')
              s=s.replace(daily,attendance,1)

          daily_render='      {active === "daily" && <DailyActivityReport salesmen={salesmen} />}'
          attendance_render='      {active === "attendance" && <AttendanceReport salesmen={salesmen} />}\n'+daily_render
          if 'active === "attendance"' not in s:
              if daily_render not in s: raise SystemExit('daily report render anchor not found')
              s=s.replace(daily_render,attendance_render,1)

          p.write_text(s)
          PY
      - name: Install and verify build
        run: |
          npm ci
          npm run build
      - name: Commit verified change and remove workflow
        run: |
          rm .github/workflows/add-attendance-report.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/add-attendance-report.yml
          git commit -m 'ui: add attendance report alongside daily activity'
          git push
