name: Refine employee contact status

on:
  push:
    paths:
      - '.github/workflows/refine-employee-contact-status.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refine employee contact cards
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/MobileContacts.jsx')
          s=p.read_text()
          s=s.replace('export default function MobileContacts({ leads, onSelectLead, renderVerification, enableCall = false }) {','export default function MobileContacts({ leads, onSelectLead, renderVerification, enableCall = false, showVerification = true }) {')
          s=s.replace('<div className="engage-mobile-contact-bottom">\n          <span className={`engage-mobile-contact-status ${lead.status || ""}`}>{status}</span>\n          <span className="engage-mobile-contact-verification">{renderVerification?.(lead)}</span>\n        </div>','<div className={`engage-mobile-contact-bottom${showVerification ? "" : " no-verification"}`}>\n          <span className={`engage-mobile-contact-status ${lead.status || ""}`}>{status}</span>\n          {showVerification && <span className="engage-mobile-contact-verification">{renderVerification?.(lead)}</span>}\n        </div>')
          p.write_text(s)

          p=Path('src/salesman/SalesmanView.jsx')
          s=p.read_text()
          old='<MobileContacts leads={contactRows} onSelectLead={setViewingLead} enableCall renderVerification={(lead) => lead.hasLocation ? <VerificationStamp status={lead.verification} small /> : <NoLocationBadge small />} />'
          new='<MobileContacts leads={contactRows} onSelectLead={setViewingLead} enableCall showVerification={false} />'
          if new not in s:
              if old not in s: raise SystemExit('Employee MobileContacts anchor not found')
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/mobile-contacts.css')
          s=p.read_text()
          rule='.engage-salesman-contacts .engage-mobile-contact-bottom.no-verification{justify-content:flex-end}'
          if rule not in s:
              s += '\n' + rule + '\n'
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Guard React source
        run: |
          FILES=$(find src -type f \( -name '*.jsx' -o -name '*.tsx' \) -print | tr '\n' ' ')
          npx --yes eslint@8 $FILES --no-eslintrc --env es6,browser --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' --rule 'no-undef:error'
      - name: Production build
        run: npm run build
      - name: Commit validated contact layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MobileContacts.jsx src/mobile-contacts.css src/salesman/SalesmanView.jsx
          git diff --cached --quiet && exit 0
          git commit -m "refine employee contact status layout"
          git push origin HEAD:main
