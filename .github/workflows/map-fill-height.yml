name: Map fill height

on:
  push:
    paths:
      - '.github/workflows/map-fill-height.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Make dashboard map fill matched card height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()

          old_card = '<div className="ft-card" style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 16, padding: 18 }}>'
          new_card = '<div className="ft-card" style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 16, padding: 18, display: "flex", flexDirection: "column", height: "100%", boxSizing: "border-box" }}>'
          if old_card not in s:
              raise SystemExit('LiveMap card anchor not found')
          s = s.replace(old_card, new_card, 1)

          old_wrap = '<div style={{ position: "relative" }}>'
          new_wrap = '<div style={{ position: "relative", flex: 1, minHeight: subtitle ? 460 : 360 }}>'
          if old_wrap not in s:
              raise SystemExit('Map wrapper anchor not found')
          s = s.replace(old_wrap, new_wrap, 1)

          old_map = '<div ref={containerRef} style={{ width: "100%", height: subtitle ? 460 : 360, borderRadius: 11, overflow: "hidden" }} />'
          new_map = '<div ref={containerRef} style={{ width: "100%", height: "100%", minHeight: subtitle ? 460 : 360, borderRadius: 11, overflow: "hidden" }} />'
          if old_map not in s:
              raise SystemExit('Map container anchor not found')
          s = s.replace(old_map, new_map, 1)

          p.write_text(s)
          PY
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/map-fill-height.yml
          git add src/App.jsx .github/workflows/map-fill-height.yml
          git commit -m "Make dashboard map fill card height"
          git push
