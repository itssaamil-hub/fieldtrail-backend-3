name: Mobile team filter alignment

on:
  push:
    paths:
      - '.github/workflows/mobile-team-filter-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Fix mobile greeting row alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '<div className="engage-admin-mobile-dashboard-utility">'
          new = '<div id="engage-admin-mobile-dashboard-utility" className="engage-admin-mobile-dashboard-utility">'
          if old not in s:
              raise SystemExit('mobile dashboard utility anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/mobile-team-filter-fix.yml
          git add src/App.jsx .github/workflows/mobile-team-filter-fix.yml
          git commit -m "Align mobile team filter with greeting"
          git push
