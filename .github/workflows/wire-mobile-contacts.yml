name: Wire admin mobile contacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-mobile-contacts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch App mobile contacts view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()

          replacements = [
            (
              "import DesktopContacts from './DesktopContacts.jsx';",
              "import DesktopContacts from './DesktopContacts.jsx';\nimport MobileContacts from './MobileContacts.jsx';",
              'contacts import anchor missing'
            ),
            (
              '{sectionNavigation && section === "deals" ? (desktopSection ? "Pipeline" : "Deals") : desktopContacts ? "Contacts" : "Leads"}',
              '{sectionNavigation && section === "deals" ? (desktopSection ? "Pipeline" : "Deals") : (desktopContacts || (phone && section === "leads")) ? "Contacts" : "Leads"}',
              'title anchor missing'
            ),
            (
              '{desktopContacts && <div className="engage-contacts-summary">{filteredLeads.length} contact records · Your restaurant connections</div>}',
              '{(desktopContacts || (phone && section === "leads")) && <div className="engage-contacts-summary">{filteredLeads.length} contact records · Your restaurant connections</div>}',
              'summary anchor missing'
            ),
            (
              '{desktopContacts ? <DesktopContacts leads={pagedLeads} onSelectLead={setSelectedLead} renderVerification={l=>l.hasLocation ? <VerificationStamp status={l.verification} small /> : <NoLocationBadge small />} /> : (',
              '{phone && section === "leads" ? <MobileContacts leads={pagedLeads} onSelectLead={setSelectedLead} renderVerification={l=>l.hasLocation ? <VerificationStamp status={l.verification} small /> : <NoLocationBadge small />} /> : desktopContacts ? <DesktopContacts leads={pagedLeads} onSelectLead={setSelectedLead} renderVerification={l=>l.hasLocation ? <VerificationStamp status={l.verification} small /> : <NoLocationBadge small />} /> : (',
              'contacts render anchor missing'
            ),
          ]
          for old, new, msg in replacements:
            assert old in s, msg
            s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          rm .github/workflows/wire-mobile-contacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/wire-mobile-contacts.yml
          git commit -m 'ui: add admin mobile contacts experience'
          git push
