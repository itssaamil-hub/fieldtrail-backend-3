name: One-time salesman messages extraction

on:
  push:
    paths:
      - '.github/workflows/extract-salesman-messages.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract salesman messages hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          app = app_path.read_text()

          def once(old, new, label):
              global app
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              app = app.replace(old, new, 1)

          once(
              'import useAttendanceDay from "./useAttendanceDay.js";\n',
              'import useAttendanceDay from "./useAttendanceDay.js";\nimport useSalesmanMessages from "./useSalesmanMessages.js";\n',
              'messages hook import'
          )

          start_marker = '  const [messages, setMessages] = useState([]);'
          end_marker = '  const getBatteryPct = useCallback(async () => {'
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          block = app[start:end]
          required = ['salesmanGetMessages', 'markMessageRead', 'deleteMessage', 'replyToMessage']
          for token in required:
              if token not in block:
                  raise SystemExit(f'messages block missing {token}')

          replacement = '''  const {\n    messages,\n    employeeRepliesEnabled,\n    setEmployeeRepliesEnabled,\n    markMessageRead,\n    deleteMessage,\n    replyToMessage,\n  } = useSalesmanMessages();\n\n'''
          app = app[:start] + replacement + app[end:]
          app_path.write_text(app)

          Path('src/useSalesmanMessages.js').write_text('''import { useCallback, useEffect, useState } from "react";\nimport { api } from "./api.js";\n\nexport default function useSalesmanMessages() {\n  const [messages, setMessages] = useState([]);\n  const [employeeRepliesEnabled, setEmployeeRepliesEnabled] = useState(true);\n\n  const loadMessages = useCallback(async () => {\n    try {\n      const res = await api.salesmanGetMessages();\n      setMessages(res.messages || []);\n    } catch {\n      // Messages are non-critical; the next poll retries.\n    }\n  }, []);\n\n  useEffect(() => {\n    loadMessages();\n    const intervalId = setInterval(loadMessages, 30000);\n    return () => clearInterval(intervalId);\n  }, [loadMessages]);\n\n  const markMessageRead = useCallback(async (id) => {\n    setMessages((prev) => prev.map((message) =>\n      message.id === id\n        ? { ...message, read_at: message.read_at || new Date().toISOString() }\n        : message\n    ));\n    try {\n      await api.salesmanMarkMessageRead(id);\n    } catch {\n      // Non-critical; the next load reconciles.\n    }\n  }, []);\n\n  const deleteMessage = useCallback(async (id) => {\n    setMessages((prev) => prev.filter((message) => message.id !== id));\n    try {\n      await api.salesmanDeleteMessage(id);\n    } catch {\n      loadMessages();\n    }\n  }, [loadMessages]);\n\n  const replyToMessage = useCallback(async (id, body) => {\n    const res = await api.salesmanReplyMessage(id, body);\n    await loadMessages();\n    return res;\n  }, [loadMessages]);\n\n  return {\n    messages,\n    employeeRepliesEnabled,\n    setEmployeeRepliesEnabled,\n    markMessageRead,\n    deleteMessage,\n    replyToMessage,\n  };\n}\n''')
          PY

      - name: Verify frontend build
        run: npm ci && npm run build

      - name: Commit extraction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/extract-salesman-messages.yml
          git add -A src/App.jsx src/useSalesmanMessages.js .github/workflows/extract-salesman-messages.yml
          git diff --cached --quiet && exit 0
          git commit -m "extract salesman messages from App"
          git push origin HEAD:main
