name: Strong frontend cleanup

on:
  push:
    paths:
      - 'tools/strong_frontend_cleanup.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply React consolidation
        run: python tools/strong_frontend_cleanup.py
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx src/Quotations.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Consolidate frontend enhancements into React"
            git push
          fi
