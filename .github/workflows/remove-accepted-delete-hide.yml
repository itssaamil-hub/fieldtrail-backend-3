name: Remove accepted quotation delete hide

on:
  push:
    branches: [fix/accepted-quotation-delete-css]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accepted-quotation-delete-css
      - name: Remove obsolete accepted-delete CSS hide rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/quotations.css')
          s = p.read_text()
          old = ".ft-ob-heading:has(.ft-q-status-accepted)>.ft-q-more .ft-q-danger{display:none}"
          if old not in s:
              raise SystemExit('accepted-delete hide rule not found')
          s = s.replace(old, '')
          p.write_text(s)
          PY
          rm .github/workflows/remove-accepted-delete-hide.yml
      - name: Commit focused CSS fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quotations.css .github/workflows/remove-accepted-delete-hide.yml
          git commit -m "Show Delete quotation for accepted quotations"
          git push origin HEAD:fix/accepted-quotation-delete-css
