name: Audit refactor boundaries
on:
  push:
    branches: [main]
    paths:
      - src/app/AppShellFeatures.jsx
      - src/reports/ReportFeatures.jsx
      - src/lead/LeadFeatures.jsx
      - src/admin/AdminAppView.jsx
      - .github/workflows/audit-refactor-boundaries.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check extracted modules for unresolved identifiers
        run: |
          cat > /tmp/eslint.config.mjs <<'EOF'
          export default [{
            files: ["src/**/*.js", "src/**/*.jsx"],
            languageOptions: {
              ecmaVersion: "latest",
              sourceType: "module",
              parserOptions: { ecmaFeatures: { jsx: true } },
              globals: {
                window: "readonly", document: "readonly", navigator: "readonly", localStorage: "readonly",
                fetch: "readonly", URLSearchParams: "readonly", CustomEvent: "readonly", Event: "readonly",
                requestAnimationFrame: "readonly", cancelAnimationFrame: "readonly", crypto: "readonly"
              }
            },
            rules: { "no-undef": "error" }
          }];
          EOF
          npx --yes eslint@9 src/app/AppShellFeatures.jsx src/reports/ReportFeatures.jsx src/lead/LeadFeatures.jsx src/admin/AdminAppView.jsx --config /tmp/eslint.config.mjs
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      - name: Remove one-time audit workflow
        run: |
          rm .github/workflows/audit-refactor-boundaries.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "complete refactor boundary audit"
          git push
