name: Extract salesman leads

# One-time workflow; removes itself after a successful build.
on:
  push:
    paths:
      - 'scripts/extract-salesman-leads.py'
      - '.github/workflows/extract-salesman-leads.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/extract-salesman-leads.py
      - run: npm ci
      - run: npm run build
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/extract-salesman-leads.py .github/workflows/extract-salesman-leads.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "extract salesman leads from App"
          git push origin HEAD:main
