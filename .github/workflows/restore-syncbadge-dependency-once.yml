name: Restore SyncBadge dependency once

on:
  push:
    branches:
      - chore/remove-offline-deal-queue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-offline-deal-queue
      - name: Restore shared SyncBadge dependency only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              assert n == 1, f'{path}: expected 1 match, got {n}'
              p.write_text(s.replace(old, new, 1))

          patch(
              'src/lead/LeadFeaturesCore.jsx',
              'leadInitials, VerificationStamp, NoLocationBadge, Overlay',
              'leadInitials, VerificationStamp, SyncBadge, NoLocationBadge, Overlay',
          )
          patch(
              'src/App.jsx',
              'leadInitials, VerificationStamp, NoLocationBadge, Overlay, Select',
              'leadInitials, VerificationStamp, SyncBadge, NoLocationBadge, Overlay, Select',
          )
          PY
      - name: Verify no offline queue returns
        shell: bash
        run: |
          ! grep -R "offlineLeadQueue\|fieldtrail:queuedLeads\|Save Lead (offline)" src test tests --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.cjs'
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/restore-syncbadge-dependency-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "preserve shared SyncBadge dependency"
          git push origin HEAD:chore/remove-offline-deal-queue
