name: Enable employee contact call

on:
  push:
    paths:
      - '.github/workflows/enable-contact-call.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable call action for employee contacts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/salesman/SalesmanView.jsx')
          s=p.read_text()
          old='<MobileContacts leads={contactRows} onSelectLead={setViewingLead} renderVerification={(lead) => lead.hasLocation ? <VerificationStamp status={lead.verification} small /> : <NoLocationBadge small />} />'
          new='<MobileContacts leads={contactRows} onSelectLead={setViewingLead} enableCall renderVerification={(lead) => lead.hasLocation ? <VerificationStamp status={lead.verification} small /> : <NoLocationBadge small />} />'
          if new not in s:
              if old not in s: raise SystemExit('MobileContacts employee anchor not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Guard React source
        run: |
          FILES=$(find src -type f \( -name '*.jsx' -o -name '*.tsx' \) -print | tr '\n' ' ')
          npx --yes eslint@8 $FILES --no-eslintrc --env es6,browser --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' --rule 'no-undef:error'
      - name: Production build
        run: npm run build
      - name: Commit validated call action
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MobileContacts.jsx src/mobile-contacts.css src/salesman/SalesmanView.jsx
          git diff --cached --quiet && exit 0
          git commit -m "enable calling from employee contacts"
          git push origin HEAD:main
