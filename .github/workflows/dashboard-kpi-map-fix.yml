name: Dashboard KPI and map cleanup

on:
  push:
    paths:
      - '.github/workflows/dashboard-kpi-map-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Apply requested dashboard changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.jsx')
          s = p.read_text()

          anchor = '  const [tasksVisited, setTasksVisited] = useState(false);\n'
          if anchor not in s:
              raise SystemExit('Admin task state anchor not found')
          s = s.replace(anchor, anchor + '  const [adminPendingTasks, setAdminPendingTasks] = useState(null);\n', 1)

          old_won = '<StatCard variant="dashboard" label="Won" value={converted} comparison={wonComparison} comparisonPeriod={comparisonPeriod} icon={CheckCircle2} color={T.verified} onClick={() => setStatLeadsModal({ title: "Won Leads", leads: dashboardLeads.filter((l) => l.status === "won") })} />'
          new_won = '<StatCard variant="dashboard" label="Won" value={converted} sub={fmtMoney(convertedValue)} comparison={wonComparison} comparisonPeriod={comparisonPeriod} icon={CheckCircle2} color={T.verified} onClick={() => setStatLeadsModal({ title: "Won Leads", leads: dashboardLeads.filter((l) => l.status === "won") })} />'
          if old_won not in s:
              raise SystemExit('Won KPI anchor not found')
          s = s.replace(old_won, new_won, 1)

          task_card = '        <StatCard variant="dashboard" label="Tasks" value={adminPendingTasks ?? 0} sub="pending" icon={List} color="#145C5D" />\n'
          renew_anchor = '        <StatCard variant="dashboard" label="Upcoming Follow-up" value={upcomingFollowUps.length} icon={CalendarClock} color={T.warn} onClick={() => setStatLeadsModal({ title: "Upcoming Follow-ups", leads: upcomingFollowUps })} />\n'
          if renew_anchor not in s:
              raise SystemExit('Upcoming Follow-up KPI anchor not found')
          s = s.replace(renew_anchor, task_card + renew_anchor, 1)

          old_tasks = '      <TasksEntry />\n'
          new_tasks = '      <div style={{ display: "none" }} aria-hidden="true"><TasksEntry onPendingChange={setAdminPendingTasks} /></div>\n'
          if old_tasks not in s:
              raise SystemExit('Dashboard TasksEntry anchor not found')
          s = s.replace(old_tasks, new_tasks, 1)

          # Remove only the dashboard employee selector located next to Live Map / Lead Locations.
          pat = re.compile(r'\n\s*<select\n\s*aria-label="Dashboard employee"[\s\S]*?</select>', re.M)
          s, n = pat.subn('', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one map employee selector, removed {n}')

          lead_tab = '<div style={{ flex: phone ? "1.25 1 0" : "0 0 auto", minWidth: 0 }}><Tab active={mapView === "leads"} onClick={() => setMapView("leads")} label="Lead Locations" /></div>'
          live_badge = lead_tab + '\n        <span style={{ display: "inline-flex", alignItems: "center", gap: 5, marginLeft: phone ? 0 : "auto", padding: "6px 9px", borderRadius: 999, background: T.verifiedSoft, color: T.verified, fontSize: 10.5, fontWeight: 800, letterSpacing: ".04em" }}><Radio size={12} /> LIVE</span>'
          if lead_tab not in s:
              raise SystemExit('Lead Locations tab anchor not found')
          s = s.replace(lead_tab, live_badge, 1)

          p.write_text(s)
          PY
      - name: Verify build and audit
        run: |
          npm run build
          npm audit --audit-level=moderate
      - name: Commit verified dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/dashboard-kpi-map-fix.yml
          git add src/App.jsx .github/workflows/dashboard-kpi-map-fix.yml
          git commit -m "Refine dashboard tasks KPI and map controls"
          git push
