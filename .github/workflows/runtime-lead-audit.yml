name: Runtime lead audit
on:
  push:
    paths:
      - '.github/workflows/runtime-lead-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Add Lead boundary fix
        run: node .github/scripts/fix-lead-tasks-boundary.js
      - run: npm ci
      - name: Check undefined identifiers in LeadFeatures
        run: >-
          npx --yes eslint@8 src/lead/LeadFeatures.jsx
          --no-eslintrc
          --env es6,browser
          --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}'
          --rule 'no-undef:error'
      - name: Smoke render Add Lead and new lead drawer
        run: npx --yes vite-node .github/scripts/smoke-lead-ui.jsx
      - name: Production build
        run: npm run build
      - name: Commit validated Add Lead fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/lead/LeadFeatures.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix Add Lead drawer dependency"
          git push origin HEAD:main
# rerun after module-mode fix
